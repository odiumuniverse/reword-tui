name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # One-time setup: base64 of the self-signed .p12 in MACOS_SIGN_P12, its password
      # in MACOS_SIGN_P12_PASSWORD, any throwaway keychain password in
      # MACOS_SIGN_KEYCHAIN_PASSWORD. Until then releases are ad-hoc signed.
      - name: Import the signing identity
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGN_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$SIGN_P12" ]; then
            echo "::warning::MACOS_SIGN_P12 is not set; releases fall back to ad-hoc signing"
            exit 0
          fi
          {
            echo "$SIGN_P12" | base64 --decode > signing.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
            security set-keychain-settings -lut 3600 signing.keychain
            security import signing.p12 -k signing.keychain -P "$SIGN_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" signing.keychain >/dev/null
            security list-keychains -d user -s signing.keychain $(security list-keychains -d user | tr -d '"')
            rm -f signing.p12
          } || echo "::warning::could not import the signing identity; releases fall back to ad-hoc signing"

      - name: Build the universal tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build/arm64 build/amd64 dist
          cargo build --release --locked --manifest-path cli/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --locked --manifest-path cli/Cargo.toml --target x86_64-apple-darwin
          GOOS=darwin GOARCH=arm64 go build -o build/arm64/reword-tui ./cmd/reword-tui
          GOOS=darwin GOARCH=amd64 go build -o build/amd64/reword-tui ./cmd/reword-tui
          lipo -create -output dist/reword-tui build/arm64/reword-tui build/amd64/reword-tui
          lipo -create -output dist/rwcore cli/target/aarch64-apple-darwin/release/rwcore cli/target/x86_64-apple-darwin/release/rwcore
          # Sign after lipo: merging architectures invalidates an earlier signature, and
          # the identifiers must be set because codesign would default both to a.out.
          for bin in reword-tui rwcore; do
            if codesign --force --sign "odiumuniverse code signing" --timestamp=none --identifier "com.odiumuniverse.${bin}" "dist/${bin}" 2>/dev/null; then
              codesign --verify --strict "dist/${bin}"
              echo "signed dist/${bin}"
            else
              echo "::warning::no signing identity; dist/${bin} stays ad-hoc signed"
            fi
          done
          tar -czf "dist/reword-tui-${version}-darwin-universal.tar.gz" -C dist reword-tui rwcore

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "dist/reword-tui-${version}-darwin-universal.tar.gz" --clobber

      - name: Bump the formula in homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/odiumuniverse/reword-tui/releases/download/${GITHUB_REF_NAME}/reword-tui-${version}-darwin-universal.tar.gz"
          sha="$(shasum -a 256 "dist/reword-tui-${version}-darwin-universal.tar.gz" | cut -d' ' -f1)"
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/odiumuniverse/homebrew-tap.git" tap
          cd tap
          ruby - "$url" "$sha" <<'RB'
          path = "Formula/reword-tui.rb"
          src = File.read(path)
          src = src.sub(%r{url "https://github\.com/odiumuniverse/reword-tui/[^"]*"}, "url \"#{ARGV[0]}\"")
          src = src.sub(/sha256 ".*"/, "sha256 \"#{ARGV[1]}\"")
          File.write(path, src)
          RB
          git add Formula/reword-tui.rb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "reword-tui ${version}"
          git push
