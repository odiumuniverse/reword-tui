[package]
name = "rwcore"
version = "0.1.0"
edition = "2024"

# Backend for reword-tui. Deliberately NOT installed to PATH by default:
# the Go TUI bundles this binary from its private dir and talks to it
# over stdio (see `install` subcommand for opt-in PATH exposure).

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
